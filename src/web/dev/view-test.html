<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D view test scene (development only)</title>
  <style>
    body { background: #000; color: #8f8; font-family: 'Courier New', monospace; margin: 16px; }
    h1 { font-size: 18px; } h2 { font-size: 14px; margin: 18px 0 6px; color: #cfc; }
    .grid { display: grid; grid-template-columns: repeat(4, 360px); gap: 10px; }
    figure { margin: 0; } figcaption { font-size: 11px; color: #6c6; margin-top: 2px; }
    canvas { display: block; border: 1px solid #0a0; background: #000; }
    #live { width: 900px; height: 420px; }
    .bar { margin: 8px 0; font-size: 12px; color: #9d9; }
    button { background: #031; color: #9f9; border: 1px solid #0a0; font: inherit; padding: 2px 8px; cursor: pointer; }
    pre { font-size: 11px; line-height: 11px; color: #4a4; }
  </style>
</head>
<body>
  <h1>The Seven Levels — 3D view test scene</h1>
  <p>A corridor enters a 7×7 high-ceilinged chamber from the south; a fountain, an altar near the far wall, two pillars, and an exit opposite. Not a saved game: nothing here touches the server.</p>

  <h2>Walk it: arrow keys (←/→ turn, ↑/↓ step) · <button id="mode">look: ascii3d</button> <span id="pos"></span></h2>
  <canvas id="live" width="900" height="420"></canvas>
  <div class="bar" id="checks"></div>
  <pre id="map"></pre>

  <div id="shots"></div>

  <script src="../view3d.js"></script>
  <script src="../view-sprites.js"></script>
  <script>
  'use strict';
  // ── The test map: chamber x 2..8, y 3..9; corridor x=5, y 10..13; exit x=5, y 0..2
  const N = 1, E = 2, S = 4, W = 8;
  const cells = new Map();
  const add = (x, y, walls, ceiling = 0) => cells.set(`${x},${y}`, { x, y, walls, ceiling });
  for (let y = 3; y <= 9; y++) for (let x = 2; x <= 8; x++) {
    let w = 0;
    if (y === 3 && x !== 5) w |= N;
    if (y === 9 && x !== 5) w |= S;
    if (x === 2) w |= W;
    if (x === 8) w |= E;
    add(x, y, w, 1);
  }
  for (let y = 10; y <= 13; y++) add(5, y, E | W | (y === 13 ? S : 0));
  for (let y = 0; y <= 2; y++) add(5, y, E | W | (y === 0 ? N : 0));
  const mats = 'sbwr';
  const scene0 = {
    level: 3, radius: 9,
    cells: [...cells.values()].map(c => [c.x, c.y, c.walls, c.ceiling,
      ['N', 'E', 'S', 'W'].map((d, i) => (c.walls & (1 << i)) ? mats[(c.x * 3 + c.y * 5 + i) % 3] : '-').join(''),
      (c.x === 2 && c.y === 6 ? W : 0) | (c.x === 8 && c.y === 6 ? E : 0) | (c.y === 3 && c.x === 3 ? N : 0),
      (c.y === 3 && c.x === 7 ? N : 0)]),
    objects: [
      { x: 5, y: 6, kind: 'fountain' },
      { x: 5, y: 4, kind: 'altar' },
      { x: 4, y: 7, kind: 'pillar' },
      { x: 6, y: 5, kind: 'pillar' },
      { x: 5, y: 11, kind: 'chest' },
    ],
  };

  const FONT_PX = 13;
  function render(canvas, look, x, y, facing, t) {
    const scene = { ...scene0, x, y, facing };
    const ctx = canvas.getContext('2d');
    ctx.font = `${FONT_PX}px 'Courier New', monospace`;
    const cellW = ctx.measureText('M').width, cellH = Math.round(FONT_PX * 1.15);
    const opts = { sprites: SceneSprites, t, cellW, cellH, font: ctx.font };
    return look === 'painted' ? View3D.renderPainted(canvas, scene, opts) : View3D.renderAscii(canvas, scene, opts);
  }

  // ── The fixed shots: entrance, centre, corner × four facings × both looks
  const SPOTS = [['entrance (5,10)', 5, 10], ['room centre (5,6)', 5, 6], ['corner (2,9)', 2, 9], ['behind a pillar (3,9): it should hide part of the fountain', 3, 9]];
  const shots = document.getElementById('shots');
  const canvases = [];
  for (const look of ['ascii3d', 'painted']) {
    for (const [name, x, y] of SPOTS) {
      const h = document.createElement('h2'); h.textContent = `${look} — ${name}`; shots.appendChild(h);
      const g = document.createElement('div'); g.className = 'grid'; shots.appendChild(g);
      for (const f of ['N', 'E', 'S', 'W']) {
        const fig = document.createElement('figure');
        const c = document.createElement('canvas'); c.width = 360; c.height = 190;
        fig.appendChild(c);
        const cap = document.createElement('figcaption'); cap.textContent = `facing ${f}`; fig.appendChild(cap);
        g.appendChild(fig);
        canvases.push([c, look, x, y, f]);
      }
    }
  }
  const drawShots = () => canvases.forEach(([c, look, x, y, f]) => render(c, look, x, y, f, 0));

  // ── The live view
  const live = document.getElementById('live');
  let look = 'ascii3d', px = 5, py = 12, facing = 'N';
  const DIRS = ['N', 'E', 'S', 'W'], FWD = { N: [0, -1], E: [1, 0], S: [0, 1], W: [-1, 0] };
  function drawLive(t = performance.now() / 1000) {
    const r = render(live, look, px, py, facing, t);
    document.getElementById('pos').textContent = `at (${px},${py}) facing ${facing}`;
    const rows = [];
    for (let y = -1; y <= 14; y++) {
      let s = '';
      for (let x = 0; x <= 10; x++) {
        const o = scene0.objects.find(o => o.x === x && o.y === y);
        s += x === px && y === py ? '@' : o ? o.kind[0].toUpperCase() : cells.has(`${x},${y}`) ? '.' : ' ';
      }
      rows.push(s);
    }
    document.getElementById('map').textContent = rows.join('\n');
    return r;
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') facing = DIRS[(DIRS.indexOf(facing) + 3) % 4];
    else if (e.key === 'ArrowRight') facing = DIRS[(DIRS.indexOf(facing) + 1) % 4];
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      const [dx, dy] = FWD[facing], s = e.key === 'ArrowUp' ? 1 : -1;
      const dir = s > 0 ? facing : DIRS[(DIRS.indexOf(facing) + 2) % 4];
      const world = View3D.buildWorld({ ...scene0, x: px, y: py, facing });
      if (!View3D.wallBetween(world, px, py, dir)) { px += dx * s; py += dy * s; }
    } else return;
    e.preventDefault();
    drawLive();
  });
  document.getElementById('mode').onclick = (e) => { look = look === 'ascii3d' ? 'painted' : 'ascii3d'; e.target.textContent = `look: ${look}`; drawLive(); };

  // Animate the live view (water, candles) unless motion is reduced.
  (function tick() { if (!View3D.prefersReducedMotion()) drawLive(); setTimeout(() => requestAnimationFrame(tick), 80); })();
  SceneSprites.onReady(() => { drawShots(); drawLive(); });
  drawShots(); drawLive();
  window.__test = { render, scene0, canvases };
  </script>
</body>
</html>
